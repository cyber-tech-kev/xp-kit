# Example: an esports team. Hex badges, neon colors, and a custom icon (icons/controller.svg).
group:
  name: Night Owls Esports
  handle: night_owls
  tagline: scrims, tournaments, clutch plays. climb the ladder.
  owner: your-github-org
  repo: xp
officers: [your-username]
theme: { accent: "#FF4FD8", bg: "#08060F", panel: "#100C1C", line: "#251C3D", text: "#E4DEF7", muted: "#8E84AD", badge_bg: "#100C1C", shape: hex }
seasons:
  - { name: "Season 3", start: 2027-01-01, end: 2027-04-30 }
sources:
  attendance: { xp: 10, unique: true, label: "showed up to scrims" }
  match_win:  { xp: 25, unique: true, label: "won an official match" }
  tournament: { xp: 60, unique: true, label: "played a tournament" }
  coached:    { xp: 20, unique: true, label: "ran a VOD review" }
  award:      { xp: null, unique: false, label: "captain award" }
levels:
  - { name: bronze,   min: 0,    color: "#C08457" }
  - { name: silver,   min: 150,  color: "#C9C7BF" }
  - { name: gold,     min: 400,  color: "#F2C14E" }
  - { name: diamond,  min: 900,  color: "#5AD3F5" }
  - { name: champion, min: 1800, color: "#FF4FD8" }
badges:
  grinder:   { icon: controller, color: "#5AD3F5", metric: streak, tiers: [4, 8, 16], desc: "Scrims in a row" }
  clutch:    { icon: bolt, color: "#FFD23F", metric: count, sources: [match_win], tiers: [1, 10, 30], desc: "Official match wins" }
  competitor: { icon: trophy, color: "#FF4FD8", metric: count, sources: [tournament], tiers: [1, 3, 8], desc: "Tournaments played" }
  coach:     { icon: crosshair, color: "#9B7BFF", metric: count, sources: [coached], tiers: [1, 5, 10], desc: "VOD reviews run" }
